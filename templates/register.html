<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الطلاب</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f2027,#2c5364);min-height:100vh;padding:20px;color:#fff;display:flex;align-items:center;justify-content:center}
.card{background:#fff;color:#222;border-radius:16px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
h2{font-size:20px;margin-bottom:6px;color:#0f2027;text-align:center}
.sub{font-size:13px;color:#888;margin-bottom:18px;text-align:center}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px;font-family:Tahoma}
input:focus{border-color:#2c5364;outline:none}
button{width:100%;padding:14px;font-size:16px;background:linear-gradient(90deg,#f7971e,#ffd200);color:#222;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:8px;font-family:Tahoma}
.back{display:block;text-align:center;color:#888;text-decoration:none;margin-top:12px;font-size:14px}
.note{background:#fff8e1;border-right:4px solid #ffb300;padding:12px;border-radius:8px;font-size:12px;line-height:1.7;margin-top:14px;color:#444}
</style>
</head>
<body>
<div class="card">
<h2>🔑 دخول الطلاب</h2>
<div class="sub">{{ subject }} — الأستاذ {{ teacher }}</div>

<label>📱 رقم الموبايل</label>
<input type="tel" id="inPhone" placeholder="01xxxxxxxxx" maxlength="15">

<label>🔐 كود التفعيل</label>
<input type="text" id="inCode" placeholder="اكتب الكود اللي وصلك" autocomplete="off">

<button onclick="doLogin()">دخول</button>
<a href="/register" class="back">← مش مسجل؟ سجل الآن</a>
<a href="/" class="back">← رجوع للرئيسية</a>

<div class="note">
💡 <b>ملاحظة:</b> كود التفعيل بيوصلك من الأستاذ بعد تأكيد الدفع
</div>
</div>

<script>
async function doLogin() {
    var p = document.getElementById('inPhone').value.trim();
    var c = document.getElementById('inCode').value.trim();
    if (!p || !c) return alert('اكمل البيانات');
    var r = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone: p, code: c})
    });
    var d = await r.json();
    if (!d.ok) return alert(d.msg);
    window.location.href = '/student';
}
</script>
</body>
</html>
