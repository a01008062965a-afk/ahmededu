<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | {{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#020617;min-height:100vh;color:#fff;padding:20px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,#0f1e3d 0%,#020617 60%);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35}
.o1{width:350px;height:350px;background:#f7971e;top:-100px;right:-100px}
.o2{width:300px;height:300px;background:#6366f1;bottom:-80px;left:-80px}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto}
.head{text-align:center;padding:20px 0 24px}
.head .logo{width:80px;height:80px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 14px;box-shadow:0 20px 50px rgba(247,151,30,0.4)}
.head h1{font-size:26px;font-weight:900;color:#fff;margin-bottom:6px}
.head p{color:#94a3b8;font-size:13px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:28px 22px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
.err{background:rgba(229,57,53,0.15);border:1px solid rgba(229,57,53,0.3);color:#ef9a9a;padding:14px;border-radius:14px;font-size:13px;font-weight:600;margin-bottom:16px;text-align:center}
.section{font-size:13px;color:#ffd200;font-weight:800;letter-spacing:1.5px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.06)}
.field{margin-bottom:16px;text-align:right}
.field label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px;font-weight:600}
.field label .req{color:#ef4444}
.field input,.field select{width:100%;padding:15px 18px;font-size:15px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:16px;color:#fff;font-family:inherit;text-align:right;font-weight:600}
.field input:focus,.field select:focus{outline:none;border-color:#ffd200;background:rgba(255,255,255,0.08)}
.field input::placeholder{color:#475569}
.field select option{background:#0f172a}
.phone-card{background:linear-gradient(135deg,rgba(247,151,30,0.15),rgba(255,210,0,0.08));border:2px solid rgba(255,210,0,0.3);border-radius:18px;padding:18px;text-align:center;margin:16px 0}
.phone-card .lbl{font-size:12px;color:#94a3b8;margin-bottom:8px;font-weight:600}
.phone-card .num{font-size:26px;font-weight:900;color:#ffd200;direction:ltr;letter-spacing:2px}
.upload{background:rgba(255,255,255,0.03);border:2px dashed rgba(255,210,0,0.25);border-radius:18px;padding:24px;text-align:center;cursor:pointer;margin-bottom:16px}
.upload .ic{font-size:38px;display:block;margin-bottom:8px}
.upload .tx{font-size:13px;color:#cbd5e1;font-weight:700}
.upload.has{background:rgba(37,211,102,0.08);border-color:#25D366;border-style:solid}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;font-size:16px;font-weight:900;border:none;border-radius:18px;cursor:pointer;font-family:inherit;text-decoration:none;margin-top:8px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;box-shadow:0 15px 40px rgba(247,151,30,0.35)}
.btn-ghost{background:transparent;color:#94a3b8;font-size:13px;padding:12px}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="wrap">
<div class="head">
<div class="logo">📝</div>
<h1>إنشاء حساب جديد</h1>
<p>{{ subject }} — الأستاذ {{ teacher }}</p>
</div>

<div class="card">
{% if error %}<div class="err">❌ {{ error }}</div>{% endif %}

<form method="POST" enctype="multipart/form-data">

<div class="section">👤 بياناتك الشخصية</div>

<div class="field">
<label>الاسم الكامل <span class="req">*</span></label>
<input type="text" name="name" placeholder="اكتب اسمك الثلاثي" required>
</div>

<div class="field">
<label>رقم الموبايل <span class="req">*</span></label>
<input type="tel" name="phone" placeholder="01xxxxxxxxx" maxlength="11" required>
</div>

<div class="field">
<label>رقم ولي الأمر <span class="req">*</span></label>
<input type="tel" name="parent_phone" placeholder="01xxxxxxxxx" maxlength="11" required>
</div>

<div class="field">
<label>الصف <span class="req">*</span></label>
<select name="grade" required>
<option value="">-- اختر الصف --</option>
<option value="first">📖 أول ثانوي</option>
<option value="second">📚 تانية ثانوي</option>
</select>
</div>

<div class="section" style="margin-top:20px">💰 الدفع</div>

<div class="phone-card">
<div class="lbl">حوّل {{ price }} جنيه على الرقم</div>
<div class="num">{{ vodafone }}</div>
</div>

<div class="field">
<label>الرقم اللي حوّلت منه <span class="req">*</span></label>
<input type="tel" name="payment_phone" placeholder="01xxxxxxxxx" maxlength="11" required>
</div>

<div class="section" style="margin-top:20px">📷 إثبات التحويل</div>

<div class="upload" id="uploadArea" onclick="document.getElementById('fileInput').click()">
<span class="ic" id="uploadIcon">📤</span>
<div class="tx" id="uploadTx">اضغط لرفع صورة التحويل</div>
</div>
<input type="file" name="screenshot" id="fileInput" accept="image/*" style="display:none" onchange="filePicked(this)">

<button type="submit" class="btn btn-primary">🚀 إرسال الطلب</button>
<a href="/" class="btn btn-ghost">← رجوع للرئيسية</a>

</form>
</div>
</div>

<script>
function filePicked(inp) {
    if (inp.files && inp.files[0]) {
        document.getElementById('uploadArea').classList.add('has');
        document.getElementById('uploadTx').textContent = '✅ تم اختيار الصورة';
        document.getElementById('uploadIcon').textContent = '✅';
    }
}
</script>
</body>
</html>
