<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }} | {{ teacher }}</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:#020617;min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.card{text-align:center;max-width:480px;width:100%}
.logo{width:120px;height:120px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:60px;margin:0 auto 24px;box-shadow:0 25px 70px rgba(247,151,30,0.5)}
h1{font-size:42px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200,#f7971e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.teacher{font-size:18px;color:#94a3b8;margin-bottom:30px}
.teacher b{color:#ffd200}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;font-size:16px;font-weight:900;border:none;border-radius:18px;text-decoration:none;cursor:pointer;margin-bottom:12px;font-family:inherit}
.btn1{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;box-shadow:0 15px 40px rgba(247,151,30,0.4)}
.btn2{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.12)}
</style>
</head>
<body>
<div class="card">
<div class="logo">📚</div>
<h1>{{ subject }}</h1>
<div class="teacher">مع الأستاذ <b>{{ teacher }}</b></div>
<a href="/register" class="btn btn1">✨ اشترك الآن</a>
<a href="/login" class="btn btn2">🔐 تسجيل الدخول</a>
</div>
</body>
</html>
