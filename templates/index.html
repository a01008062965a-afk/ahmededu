<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }} | {{ teacher }}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#020617;min-height:100vh;color:#fff;position:relative;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,#0f1e3d 0%,#020617 60%);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35}
.o1{width:400px;height:400px;background:#f7971e;top:-120px;right:-120px}
.o2{width:350px;height:350px;background:#6366f1;bottom:-100px;left:-100px}
.wrap{position:relative;z-index:2;max-width:480px;width:100%;text-align:center}
.logo{width:110px;height:110px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:56px;margin:0 auto 20px;box-shadow:0 25px 60px rgba(247,151,30,0.4)}
h1{font-size:38px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200,#f7971e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.teacher{font-size:16px;color:#94a3b8;margin-bottom:30px}
.teacher b{color:#ffd200}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:32px;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
.chip{display:inline-block;padding:8px 16px;background:rgba(255,210,0,0.1);border:1px solid rgba(255,210,0,0.3);border-radius:100px;font-size:13px;color:#ffd200;font-weight:700;margin-bottom:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;font-size:16px;font-weight:900;border:none;border-radius:18px;text-decoration:none;cursor:pointer;font-family:inherit;margin-bottom:12px}
.btn:active{transform:scale(0.97)}
.btn1{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;box-shadow:0 15px 40px rgba(247,151,30,0.35)}
.btn2{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.12)}
.footer{margin-top:20px;color:#475569;font-size:12px}
.footer a{color:#94a3b8;text-decoration:none}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="wrap">
<div class="logo">📚</div>
<h1>{{ subject }}</h1>
<div class="teacher">مع الأستاذ <b>{{ teacher }}</b></div>

<div class="card">
<div class="chip">💎 {{ price }} جنيه / الترم</div>
<a href="/register" class="btn btn1">✨ إنشاء حساب جديد</a>
<a href="/login" class="btn btn2">🔐 تسجيل الدخول</a>
</div>

<div class="footer">
منصة {{ teacher }} © 2027<br>
<a href="/admin/login">دخول الأستاذ</a>
</div>
</div>

</body>
</html>
