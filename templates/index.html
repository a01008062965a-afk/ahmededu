<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }} | {{ teacher }}</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#050914;min-height:100vh;color:#fff;overflow-x:hidden;position:relative}

/* خلفية متحركة */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(247,151,30,0.15),transparent 70%);border-radius:50%;animation:float1 20s infinite ease-in-out}
.bg::after{content:'';position:absolute;bottom:-30%;left:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(0,180,255,0.12),transparent 70%);border-radius:50%;animation:float2 25s infinite ease-in-out}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}

.main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}

/* الشعار */
.logo-wrap{text-align:center;margin-bottom:24px}
.logo-circle{width:90px;height:90px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 14px;box-shadow:0 10px 40px rgba(247,151,30,0.4);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.title{font-size:34px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200,#f7971e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;letter-spacing:-1px}
.subtitle{color:#7a9bab;font-size:14px;font-weight:500}

/* البطاقة الرئيسية */
.glass-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:28px 24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative;overflow:hidden}
.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,0,0.5),transparent)}

.section-title{font-size:13px;color:#ffd200;font-weight:bold;letter-spacing:2px;text-align:center;margin-bottom:20px}

/* معلومات الكورس */
.info-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.info-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;transition:.2s}
.info-item:active{background:rgba(255,210,0,0.08)}
.info-icon{width:42px;height:42px;background:linear-gradient(135deg,rgba(247,151,30,0.2),rgba(255,210,0,0.1));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.info-content{flex:1}
.info-label{font-size:11px;color:#7a9bab;margin-bottom:2px}
.info-value{font-size:15px;font-weight:bold;color:#fff}

/* الأزرار */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;font-size:16px;font-weight:bold;border:none;border-radius:16px;text-decoration:none;cursor:pointer;font-family:inherit;transition:.2s;margin-bottom:10px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0f2027;box-shadow:0 8px 30px rgba(255,210,0,0.3);position:relative;overflow:hidden}
.btn-primary::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shine 3s infinite}
@keyframes shine{to{left:100%}}
.btn-secondary{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.1)}
.btn-secondary:active{background:rgba(255,210,0,0.12)}

/* المميزات */
.features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.feature{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px 10px;text-align:center;transition:.2s}
.feature:active{background:rgba(255,210,0,0.08)}
.feature-icon{font-size:26px;margin-bottom:8px}
.feature-text{font-size:11px;color:#a0b8c4;font-weight:600}

/* الفوتر */
.footer{text-align:center;margin-top:24px;color:#4a5a6a;font-size:12px}
.footer a{color:#7a9bab;text-decoration:none;margin:0 8px}
.footer a:active{color:#ffd200}

/* شريط الحالة */
.status-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:11px;color:#7a9bab}
.status-dot{width:6px;height:6px;background:#25D366;border-radius:50%;box-shadow:0 0 8px #25D366;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>

<div class="bg"></div>

<div class="main">
<div class="logo-wrap">
<div class="logo-circle">📚</div>
<div class="title">{{ subject }}</div>
<div class="subtitle">مع الأستاذ {{ teacher }}</div>
</div>

<div class="glass-card">
<div class="section-title">✦ معلومات الكورس ✦</div>

<div class="info-grid">
<div class="info-item">
<div class="info-icon">👨‍🏫</div>
<div class="info-content">
<div class="info-label">المدرس</div>
<div class="info-value">{{ teacher }}</div>
</div>
</div>

<div class="info-item">
<div class="info-icon">📖</div>
<div class="info-content">
<div class="info-label">المادة</div>
<div class="info-value">{{ subject }}</div>
</div>
</div>

<div class="info-item">
<div class="info-icon">🎓</div>
<div class="info-content">
<div class="info-label">الصفوف</div>
<div class="info-value">أول و تانية ثانوي</div>
</div>
</div>

<div class="info-item">
<div class="info-icon">💎</div>
<div class="info-content">
<div class="info-label">السعر</div>
<div class="info-value">{{ price }} جنيه / الترم</div>
</div>
</div>
</div>

<a href="/register" class="btn btn-primary">🚀 سجل الآن</a>
<a href="/login" class="btn btn-secondary">🔑 دخول الطلاب</a>

<div class="features">
<div class="feature">
<div class="feature-icon">🎬</div>
<div class="feature-text">فيديوهات HD</div>
</div>
<div class="feature">
<div class="feature-icon">📝</div>
<div class="feature-text">واجبات</div>
</div>
<div class="feature">
<div class="feature-icon">📊</div>
<div class="feature-text">امتحانات</div>
</div>
<div class="feature">
<div class="feature-icon">🏆</div>
<div class="feature-text">نتائج فورية</div>
</div>
</div>

<div class="status-bar">
<div class="status-dot"></div>
<span>المنصة تعمل الآن</span>
</div>
</div>

<div class="footer">
منصة {{ teacher }} © 2027
<br>
<a href="/admin/login">دخول الأدمن</a>
</div>
</div>

</body>
</html>
