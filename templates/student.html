<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة الطالب | {{ subject }}</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#050914;min-height:100vh;color:#fff;padding-bottom:30px;position:relative}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(247,151,30,0.1),transparent 70%);border-radius:50%;animation:float1 20s infinite ease-in-out}
.bg::after{content:'';position:absolute;bottom:-30%;left:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(0,180,255,0.08),transparent 70%);border-radius:50%;animation:float2 25s infinite ease-in-out}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}

.wrap{position:relative;z-index:1}

header{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.user-info{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#0f2027}
.user-text .name{font-size:14px;font-weight:bold}
.user-text .grade{font-size:11px;color:#7a9bab;margin-top:2px}
.logout-btn{background:rgba(229,57,53,0.15);color:#ef9a9a;border:1px solid rgba(229,57,53,0.3);padding:8px 14px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:bold}
.logout-btn:active{background:rgba(229,57,53,0.3)}

.tabs{display:flex;gap:6px;padding:12px;overflow-x:auto;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.05);position:sticky;top:72px;z-index:40}
.tab{padding:10px 16px;background:rgba(255,255,255,0.05);border-radius:12px;cursor:pointer;font-size:12px;font-weight:bold;white-space:nowrap;color:#a0b8c4;border:1px solid transparent;transition:.2s}
.tab.active{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0f2027;box-shadow:0 4px 15px rgba(255,210,0,0.3)}

.container{padding:16px;max-width:820px;margin:0 auto}

.video-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.2s}
.video-card:active{background:rgba(255,210,0,0.1);border-color:rgba(255,210,0,0.3)}
.video-thumb{width:60px;height:60px;background:linear-gradient(135deg,rgba(247,151,30,0.2),rgba(255,210,0,0.08));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.video-info{flex:1}
.video-info .t{font-size:14px;font-weight:bold;margin-bottom:4px}
.video-info .l{font-size:11px;color:#7a9bab}
.play-icon{color:#ffd200;font-size:22px}

.hw-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px;margin-bottom:12px;border-right:3px solid #ffd200}
.hw-card .title{font-size:15px;font-weight:bold;color:#ffd200;margin-bottom:8px}
.hw-card .desc{font-size:13px;color:#a0b8c4;line-height:1.8}
.hw-card .due{margin-top:10px;font-size:12px;color:#ff9800;background:rgba(255,152,0,0.1);padding:6px 10px;border-radius:8px;display:inline-block}

.exam-card{background:linear-gradient(135deg,rgba(247,151,30,0.12),rgba(255,210,0,0.05));border:1px solid rgba(255,210,0,0.25);border-radius:16px;padding:18px;margin-bottom:12px}
.exam-card .title{font-size:15px;font-weight:bold;color:#ffd200;margin-bottom:6px}
.exam-card .meta{font-size:12px;color:#a0b8c4;margin-bottom:14px}
.exam-card button{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0f2027;border:none;padding:12px 24px;border-radius:12px;font-weight:bold;font-family:inherit;cursor:pointer;font-size:14px;box-shadow:0 6px 20px rgba(255,210,0,0.3)}
.exam-card button:active{transform:scale(.97)}
.done-badge{background:rgba(37,211,102,0.15);color:#a5d6a7;padding:10px 16px;border-radius:12px;font-size:13px;display:inline-block;border:1px solid rgba(37,211,102,0.3)}

.result-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px;margin-bottom:10px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
.result-row:last-child{border-bottom:none}
.result-score{background:rgba(37,211,102,0.15);color:#a5d6a7;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:13px}
.result-score.low{background:rgba(229,57,53,0.15);color:#ef9a9a}

.empty{text-align:center;color:#5a7a8a;padding:60px 20px;font-size:14px}
.empty .ic{font-size:52px;display:block;margin-bottom:14px;opacity:0.5}
.hidden{display:none}

/* النافذة الامتحان */
.overlay{position:fixed;inset:0;background:rgba(5,9,20,0.95);backdrop-filter:blur(10px);z-index:100;padding:16px;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
.overlay.hidden{display:none}
.exam-box{background:#0a1420;border:1px solid rgba(255,210,0,0.2);border-radius:20px;padding:20px;max-width:600px;width:100%;margin:auto}
.exam-box h2{color:#ffd200;font-size:17px;margin-bottom:6px;text-align:center}
.timer{background:linear-gradient(135deg,rgba(247,151,30,0.2),rgba(255,210,0,0.1));border:1px solid rgba(255,210,0,0.3);color:#ffd200;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin:12px 0;font-size:16px}
.timer.warning{background:rgba(229,57,53,0.2);border-color:rgba(229,57,53,0.4);color:#ef9a9a;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

.question{margin:16px 0;padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px}
.question .q{font-size:14px;margin-bottom:12px;line-height:1.8}
.question .q .num{color:#ffd200;font-weight:bold;margin-left:6px}
.option{padding:12px 14px;background:rgba(255,255,255,0.04);border:2px solid transparent;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13px;color:#a0b8c4;transition:.2s;display:flex;align-items:center;gap:10px}
.option .mark{width:22px;height:22px;border-radius:50%;border:2px solid #3a4a5a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#7a9bab;flex-shrink:0}
.option:active{background:rgba(255,210,0,0.08)}
.option.selected{background:linear-gradient(135deg,rgba(247,151,30,0.2),rgba(255,210,0,0.1));border-color:#ffd200;color:#fff;font-weight:bold}
.option.selected .mark{background:#ffd200;color:#0f2027;border-color:#ffd200}

.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#f7971e,#ffd200);color:#0f2027;border:none;border-radius:14px;font-weight:bold;font-size:16px;font-family:inherit;cursor:pointer;margin-top:16px;box-shadow:0 8px 30px rgba(255,210,0,0.3)}
.submit-btn:active{transform:scale(.97)}
</style>
</head>
<body>

<div class="bg"></div>

<div class="wrap">

<header>
<div class="user-info">
<div class="avatar" id="avatar">؟</div>
<div class="user-text">
<div class="name" id="uName">جاري التحميل...</div>
<div class="grade" id="uGrade">-</div>
</div>
</div>
<a href="#" class="logout-btn" onclick="logout();return false;">خروج</a>
</header>

<div class="tabs">
<div class="tab active" onclick="tab('videos',this)">🎬 الفيديوهات</div>
<div class="tab" onclick="tab('homework',this)">📝 الواجبات</div>
<div class="tab" onclick="tab('exams',this)">📊 الامتحانات</div>
<div class="tab" onclick="tab('results',this)">🏆 نتائجي</div>
</div>

<div class="container">
<div id="videosView"></div>
<div id="homeworkView" class="hidden"></div>
<div id="examsView" class="hidden"></div>
<div id="resultsView" class="hidden"></div>
</div>

</div>

<div class="overlay hidden" id="examOverlay">
<div class="exam-box" id="examBox"></div>
</div>

<script>
var student = null;
var currentExam = null;
var currentAnswers = [];
var timerInterval = null;

async function loadMe() {
    var r = await fetch('/api/me');
    var d = await r.json();
    if (!d.ok) { window.location.href = '/login'; return; }
    student = d.student;
    document.getElementById('uName').textContent = student.name;
    document.getElementById('uGrade').textContent = student.grade_name;
    document.getElementById('avatar').textContent = student.name.charAt(0).toUpperCase();
}

async function loadVideos() {
    var r = await fetch('/api/videos');
    var d = await r.json();
    var b = document.getElementById('videosView');
    if (!d.length) {
        b.innerHTML = '<div class="empty"><span class="ic">🎬</span>مفيش فيديوهات لسه</div>';
        return;
    }
    b.innerHTML = d.map(function(v) {
        return '<div class="video-card" onclick="window.open(\'' + v.url + '\',\'_blank\')">' +
            '<div class="video-thumb">🎬</div>' +
            '<div class="video-info"><div class="t">' + v.title + '</div>' +
            '<div class="l">' + (v.lesson || 'درس جديد') + ' — ' + v.created_at + '</div></div>' +
            '<div class="play-icon">▶</div>' +
            '</div>';
    }).join('');
}

async function loadHomework() {
    var r = await fetch('/api/homework');
    var d = await r.json();
    var b = document.getElementById('homeworkView');
    if (!d.length) {
        b.innerHTML = '<div class="empty"><span class="ic">📝</span>مفيش واجبات لسه</div>';
        return;
    }
    b.innerHTML = d.map(function(h) {
        return '<div class="hw-card">' +
            '<div class="title">📝 ' + h.title + '</div>' +
            '<div class="desc">' + h.description + '</div>' +
            (h.due_date ? '<div class="due">⏰ آخر ميعاد: ' + h.due_date + '</div>' : '') +
            '</div>';
    }).join('');
}

async function loadExams() {
    var r = await fetch('/api/exams');
    var d = await r.json();
    var b = document.getElementById('examsView');
    if (!d.exams || !d.exams.length) {
        b.innerHTML = '<div class="empty"><span class="ic">📊</span>مفيش امتحانات متاحة</div>';
        return;
    }
    b.innerHTML = d.exams.map(function(e) {
        var isDone = d.done.indexOf(e.id) !== -1;
        return '<div class="exam-card">' +
            '<div class="title">📊 ' + e.title + '</div>' +
            '<div class="meta">⏰ ' + e.duration + ' دقيقة — ' + e.total + ' سؤال</div>' +
            (isDone
                ? '<div class="done-badge">✅ خلصت الامتحان ده</div>'
                : '<button onclick="startExam(' + e.id + ')">🚀 ابدأ الامتحان</button>') +
            '</div>';
    }).join('');
}

async function loadResults() {
    var r = await fetch('/api/my-results');
    var d = await r.json();
    var b = document.getElementById('resultsView');
    if (!d.length) {
        b.innerHTML = '<div class="empty"><span class="ic">🏆</span>مفيش نتائج لسه</div>';
        return;
    }
    b.innerHTML = d.map(function(r) {
        var pct = Math.round((r.score / r.total) * 100);
        var cls = pct >= 50 ? '' : 'low';
        return '<div class="result-card">' +
            '<div class="result-row">' +
            '<span>امتحان #' + r.exam_id + ' — ' + r.created_at + '</span>' +
            '<span class="result-score ' + cls + '">' + r.score + ' / ' + r.total + ' (' + pct + '%)</span>' +
            '</div></div>';
    }).join('');
}

async function startExam(id) {
    if (!confirm('متأكد إنك عايز تبدأ؟ لو خرجت مش هتقدر تدخل تاني!')) return;
    var r = await fetch('/api/exam/' + id);
    var d = await r.json();
    if (!d.ok) return alert(d.msg || 'خطأ');
    currentExam = d.exam;
    currentAnswers = new Array(currentExam.questions.length).fill(null);
    showExam();
}

function showExam() {
    var e = currentExam;
    var html = '<h2>📊 ' + e.title + '</h2>';
    html += '<div class="timer" id="timer">⏰ ' + e.duration + ':00</div>';
    e.questions.forEach(function(q, i) {
        html += '<div class="question">';
        html += '<div class="q"><span class="num">' + (i+1) + '.</span> ' + q.q + '</div>';
        ['a', 'b', 'c', 'd'].forEach(function(key, idx) {
            html += '<div class="option" data-q="' + i + '" data-v="' + idx + '" onclick="pick(this)">' +
                '<span class="mark">' + (idx+1) + '</span> ' + q[key] +
                '</div>';
        });
        html += '</div>';
    });
    html += '<button class="submit-btn" onclick="submitExam()">📤 تسليم الامتحان</button>';
    document.getElementById('examBox').innerHTML = html;
    document.getElementById('examOverlay').classList.remove('hidden');
    startTimer(e.duration);
}

function pick(el) {
    var qi = parseInt(el.dataset.q);
    var v = parseInt(el.dataset.v);
    currentAnswers[qi] = v;
    document.querySelectorAll('.option[data-q="' + qi + '"]').forEach(function(x){ x.classList.remove('selected'); });
    el.classList.add('selected');
}

function startTimer(minutes) {
    var total = minutes * 60;
    timerInterval = setInterval(function() {
        total--;
        if (total <= 0) {
            clearInterval(timerInterval);
            alert('⏰ خلص الوقت!');
            submitExam(true);
            return;
        }
        var m = Math.floor(total / 60);
        var s = total % 60;
        var el = document.getElementById('timer');
        if (el) {
            el.textContent = '⏰ ' + m + ':' + (s < 10 ? '0' : '') + s;
            if (total <= 60) el.classList.add('warning');
        }
    }, 1000);
}

async function submitExam(force) {
    if (!force && !confirm('متأكد من التسليم؟ مش هتقدر ترجع تاني!')) return;
    clearInterval(timerInterval);
    var r = await fetch('/api/exam/' + currentExam.id + '/submit', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({answers: currentAnswers})
    });
    var d = await r.json();
    document.getElementById('examOverlay').classList.add('hidden');
    if (d.ok) {
        alert('🎉 نتيجتك: ' + d.score + ' / ' + d.total + '\nالنسبة: ' + Math.round((d.score/d.total)*100) + '%');
        loadExams();
    } else {
        alert(d.msg || 'خطأ');
    }
}

function tab(t, el) {
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    ['videos','homework','exams','results'].forEach(function(v){
        document.getElementById(v+'View').classList.add('hidden');
    });
    document.getElementById(t+'View').classList.remove('hidden');
    if (t === 'videos') loadVideos();
    if (t === 'homework') loadHomework();
    if (t === 'exams') loadExams();
    if (t === 'results') loadResults();
}

async function logout() {
    await fetch('/api/logout');
    window.location.href = '/';
}

loadMe().then(function(){ loadVideos(); });
</script>
</body>
</html>
