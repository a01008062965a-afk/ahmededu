<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الطلاب | {{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#020617;min-height:100vh;color:#fff;position:relative;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,#0f1e3d 0%,#020617 60%);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35}
.o1{width:350px;height:350px;background:#f7971e;top:-100px;right:-100px}
.o2{width:300px;height:300px;background:#6366f1;bottom:-80px;left:-80px}
.wrap{position:relative;z-index:2;max-width:440px;width:100%}
.head{text-align:center;padding:20px 0 24px}
.head .logo{width:90px;height:90px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:46px;margin:0 auto 16px;box-shadow:0 20px 50px rgba(247,151,30,0.4)}
.head h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:6px}
.head p{color:#94a3b8;font-size:13px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
.err{background:rgba(229,57,53,0.15);border:1px solid rgba(229,57,53,0.3);color:#ef9a9a;padding:14px;border-radius:14px;font-size:13px;font-weight:600;margin-bottom:16px;text-align:center}
.field{margin-bottom:18px;text-align:right}
.field label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px;font-weight:600}
.field input{width:100%;padding:16px 18px;font-size:16px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:16px;color:#fff;font-family:inherit;text-align:right;font-weight:600}
.field input:focus{outline:none;border-color:#ffd200;background:rgba(255,255,255,0.08)}
.field input::placeholder{color:#475569}
.field input.code{font-family:monospace;letter-spacing:4px;text-align:center;text-transform:uppercase;font-size:18px;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;font-size:16px;font-weight:900;border:none;border-radius:18px;cursor:pointer;font-family:inherit;text-decoration:none;margin-top:8px}
.btn:active{transform:scale(0.97)}
.btn1{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;box-shadow:0 15px 40px rgba(247,151,30,0.35)}
.btn2{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.1)}
.btn3{background:transparent;color:#94a3b8;font-size:13px;padding:12px}
.div{display:flex;align-items:center;gap:12px;margin:20px 0;color:#475569;font-size:12px;font-weight:600}
.div::before,.div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}
.note{background:rgba(255,210,0,0.06);border:1px solid rgba(255,210,0,0.2);border-radius:14px;padding:14px;font-size:12px;line-height:1.9;color:#cbd5e1;margin-top:18px}
.note b{color:#ffd200}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="wrap">
<div class="head">
<div class="logo">🔐</div>
<h1>تسجيل الدخول</h1>
<p>{{ subject }} — الأستاذ {{ teacher }}</p>
</div>

<div class="card">
{% if error %}<div class="err">❌ {{ error }}</div>{% endif %}

<form method="POST">

<div class="field">
<label>📱 رقم الموبايل</label>
<input type="tel" name="phone" placeholder="01xxxxxxxxx" maxlength="11" required>
</div>

<div class="field">
<label>🔑 كود التفعيل</label>
<input type="text" name="code" placeholder="A1B2C3D4" maxlength="12" class="code" required>
</div>

<button type="submit" class="btn btn1">🚀 دخول</button>

</form>

<div class="div">أو</div>

<a href="/register" class="btn btn2">✨ إنشاء حساب جديد</a>
<a href="/" class="btn btn3">← رجوع للرئيسية</a>

<div class="note">
💡 <b>ملاحظة:</b> الكود بيوصلك من الأستاذ بعد تأكيد الدفع
</div>
</div>
</div>

</body>
</html>
