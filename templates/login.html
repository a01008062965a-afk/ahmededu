<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الطلاب | {{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#020617;min-height:100vh;color:#fff;padding:20px;position:relative;overflow-x:hidden;display:flex;align-items:center;justify-content:center}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at top,#0f1e3d 0%,#020617 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4}
.orb1{width:350px;height:350px;background:linear-gradient(135deg,#f7971e,#ffd200);top:-100px;right:-100px;animation:float1 15s infinite}
.orb2{width:300px;height:300px;background:linear-gradient(135deg,#6366f1,#8b5cf6);bottom:-80px;left:-80px;animation:float2 18s infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,60px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-40px)}}

.wrap{position:relative;z-index:2;max-width:440px;width:100%}

/* الهيدر */
.header{text-align:center;padding:20px 0 24px}
.logo{width:90px;height:90px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:46px;margin:0 auto 16px;box-shadow:0 20px 50px rgba(247,151,30,0.4);animation:logoFloat 3s infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.header h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200,#f7971e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.header p{color:#94a3b8;font-size:13px;font-weight:600}

/* البطاقة */
.card{background:rgba(255,255,255,0.03);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,0.5);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,0,0.6),transparent)}

.section-title{text-align:center;font-size:14px;color:#ffd200;font-weight:700;letter-spacing:2px;margin-bottom:22px}

/* الحقول */
.field{margin-bottom:18px;text-align:right;position:relative}
.field label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px;padding-right:4px;font-weight:600}
.field input{width:100%;padding:16px 18px;font-size:16px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:16px;color:#fff;font-family:inherit;text-align:right;transition:.25s;font-weight:600}
.field input:focus{outline:none;border-color:#ffd200;background:rgba(255,255,255,0.08);box-shadow:0 0 0 4px rgba(255,210,0,0.1)}
.field input::placeholder{color:#475569;font-weight:500}
.field input.code{font-family:'Courier New',monospace;letter-spacing:4px;text-align:center;text-transform:uppercase;font-size:18px;font-weight:900}

/* زر */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;font-size:16px;font-weight:900;border:none;border-radius:18px;text-decoration:none;cursor:pointer;font-family:inherit;transition:.25s;margin-top:8px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;box-shadow:0 15px 40px rgba(247,151,30,0.35);position:relative;overflow:hidden}
.btn-primary::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent)}
.btn-primary:active::after{left:100%;transition:.6s}
.btn-primary:disabled{opacity:0.6}
.btn-secondary{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.1);font-size:15px}
.btn-secondary:active{background:rgba(255,210,0,0.1);border-color:rgba(255,210,0,0.3)}
.btn-ghost{background:transparent;color:#94a3b8;font-size:13px;padding:12px;font-weight:600}
.btn-ghost:active{color:#ffd200}

/* فاصل */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#475569;font-size:12px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}

/* تنبيه */
.note{background:rgba(255,210,0,0.06);border:1px solid rgba(255,210,0,0.2);border-radius:14px;padding:14px 16px;font-size:12px;line-height:1.9;color:#cbd5e1;margin-top:18px}
.note b{color:#ffd200}
.note .em{color:#ffd200;font-size:14px;margin-left:4px}
</style>
</head>
<body>

<div class="bg">
<div class="orb orb1"></div>
<div class="orb orb2"></div>
</div>

<div class="wrap">

<div class="header">
<div class="logo">🔐</div>
<h1>تسجيل الدخول</h1>
<p>{{ subject }} — الأستاذ {{ teacher }}</p>
</div>

<div class="card">
<div class="section-title">✦ ادخل بياناتك ✦</div>

<div class="field">
<label>📱 رقم الموبايل</label>
<input type="tel" id="inPhone" placeholder="01xxxxxxxxx" maxlength="11" inputmode="numeric" autocomplete="tel">
</div>

<div class="field">
<label>🔑 كود التفعيل</label>
<input type="text" id="inCode" placeholder="A1B2C3D4" maxlength="12" class="code" autocomplete="off">
</div>

<button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
<span>🚀</span> دخول
</button>

<div class="divider">أو</div>

<a href="/register" class="btn btn-secondary">✨ إنشاء حساب جديد</a>
<a href="/" class="btn btn-ghost">← رجوع للرئيسية</a>

<div class="note">
<span class="em">💡</span><b>ملاحظة مهمة:</b><br>
لو لسه مسجلتش، اضغط "إنشاء حساب جديد"<br>
لو سجلت ومستني الموافقة، استنى رسالة الأستاذ بالكود
</div>

</div>

</div>

<script>
async function doLogin() {
    var phone = document.getElementById('inPhone').value.trim();
    var code = document.getElementById('inCode').value.trim().toUpperCase();

    if (!phone || phone.length !== 11) return alert('اكتب رقم موبايل صحيح');
    if (!code || code.length < 4) return alert('اكتب كود التفعيل');

    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> جاري التحقق...';

    try {
        var r = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone: phone, code: code })
        });
        var d = await r.json();
        if (!d.ok) {
            alert('❌ ' + d.msg);
            btn.disabled = false;
            btn.innerHTML = '<span>🚀</span> دخول';
            return;
        }
        window.location.href = '/student';
    } catch(e) {
        alert('خطأ في الاتصال');
        btn.disabled = false;
        btn.innerHTML = '<span>🚀</span> دخول';
    }
}

document.getElementById('inCode').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
});
document.getElementById('inPhone').addEventListener('input', function(e) {
    this.value = this.value.replace(/\D/g, '');
});
</script>
</body>
</html>
