<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الطلاب | {{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#020617;min-height:100vh;color:#fff;position:relative;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at top,#0f1e3d 0%,#020617 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.35}
.o1{width:400px;height:400px;background:#f7971e;top:-120px;right:-120px;animation:f1 18s infinite}
.o2{width:380px;height:380px;background:#6366f1;bottom:-120px;left:-120px;animation:f2 20s infinite}
.o3{width:250px;height:250px;background:#06b6d4;top:40%;left:40%;animation:f3 22s infinite}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,70px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-50px)}}
@keyframes f3{0%,100%{transform:translate(0,0)}33%{transform:translate(-40px,-40px)}66%{transform:translate(50px,40px)}}

.stars{position:absolute;inset:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{0%,100%{opacity:0.2}50%{opacity:1}}

.wrap{position:relative;z-index:2;max-width:440px;width:100%}

/* Header */
.head{text-align:center;padding:20px 0 26px;position:relative}
.logo-wrap{position:relative;margin-bottom:18px;display:inline-block}
.logo-glow{position:absolute;inset:-10px;background:radial-gradient(circle,rgba(247,151,30,0.5),transparent 70%);filter:blur(28px);animation:pl 3s infinite}
@keyframes pl{0%,100%{opacity:0.5}50%{opacity:1}}
.logo{position:relative;width:88px;height:88px;background:linear-gradient(135deg,#f7971e 0%,#ffd200 50%,#f7971e 100%);background-size:200% 200%;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto;box-shadow:0 20px 50px rgba(247,151,30,0.5);animation:lr 8s infinite ease-in-out,lgl 3s infinite}
@keyframes lr{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes lgl{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

h1{font-size:26px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200,#f7971e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.head p{color:#94a3b8;font-size:13px;font-weight:600}

/* Card */
.card{background:rgba(255,255,255,0.03);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:32px 24px;box-shadow:0 30px 80px rgba(0,0,0,0.5);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,0,0.6),transparent)}

.err{background:rgba(229,57,53,0.15);border:1.5px solid rgba(229,57,53,0.3);color:#ef9a9a;padding:14px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:18px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}

.field{margin-bottom:18px;text-align:right;position:relative}
.field label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px;font-weight:700}
.field .inp-wrap{position:relative}
.field .inp-ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:0.6}
.field input{width:100%;padding:16px 48px 16px 18px;font-size:16px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:16px;color:#fff;font-family:inherit;text-align:right;font-weight:600;transition:.25s}
.field input:focus{outline:none;border-color:#ffd200;background:rgba(255,255,255,0.08);box-shadow:0 0 0 4px rgba(255,210,0,0.1)}
.field input::placeholder{color:#475569;font-weight:500}
.field input.code{font-family:monospace;letter-spacing:4px;text-align:center;text-transform:uppercase;font-size:18px;font-weight:900;padding-right:18px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;font-size:16px;font-weight:900;border:none;border-radius:18px;cursor:pointer;font-family:inherit;text-decoration:none;transition:.25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.btn:active{transform:scale(0.97)}
.btn1{background:linear-gradient(135deg,#f7971e 0%,#ffd200 50%,#f7971e 100%);background-size:200% 100%;color:#0a0f1e;box-shadow:0 15px 40px rgba(247,151,30,0.4);margin-top:8px}
.btn1::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent)}
.btn1:active::after{left:100%;transition:.6s}
.btn2{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.12)}
.btn2:active{background:rgba(255,210,0,0.1);border-color:rgba(255,210,0,0.4)}
.btn3{background:transparent;color:#94a3b8;font-size:13px;padding:12px;font-weight:700}
.btn3:active{color:#ffd200}

.div{display:flex;align-items:center;gap:12px;margin:22px 0;color:#475569;font-size:12px;font-weight:700}
.div::before,.div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}

.note{background:rgba(255,210,0,0.06);border:1.5px solid rgba(255,210,0,0.2);border-radius:14px;padding:14px 16px;font-size:12px;line-height:1.9;color:#cbd5e1;margin-top:20px;display:flex;gap:10px;align-items:flex-start}
.note .em{font-size:18px;flex-shrink:0}
.note b{color:#ffd200}
</style>
</head>
<body>

<div class="bg">
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="stars" id="stars"></div>
</div>

<div class="wrap">

<div class="head">
<div class="logo-wrap">
<div class="logo-glow"></div>
<div class="logo">🔐</div>
</div>
<h1>تسجيل الدخول</h1>
<p>{{ subject }} — الأستاذ {{ teacher }}</p>
</div>

<div class="card">
{% if error %}
<div class="err">⚠️ {{ error }}</div>
{% endif %}

<form method="POST">

<div class="field">
<label>📱 رقم الموبايل</label>
<div class="inp-wrap">
<input type="tel" name="phone" placeholder="01xxxxxxxxx" maxlength="11" required>
<span class="inp-ic">📞</span>
</div>
</div>

<div class="field">
<label>🔑 كود التفعيل</label>
<div class="inp-wrap">
<input type="text" name="code" placeholder="A1B2C3D4" maxlength="12" class="code" required>
<span class="inp-ic">🎫</span>
</div>
</div>

<button type="submit" class="btn btn1">🚀 دخول</button>

</form>

<div class="div">أو</div>

<a href="/register" class="btn btn2">✨ حساب جديد</a>
<a href="/" class="btn btn3">← رجوع للرئيسية</a>

<div class="note">
<span class="em">💡</span>
<div><b>ملاحظة:</b> كود التفعيل بيوصلك من الأستاذ بعد تأكيد الدفع</div>
</div>

</div>
</div>

<script>
var sb = document.getElementById('stars');
for (var i = 0; i < 30; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var sz = Math.random() * 2 + 1;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    sb.appendChild(s);
}
</script>
</body>
</html>
