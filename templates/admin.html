<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الأستاذ</title>
<style>
*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}
body{background:#0a1929;color:#fff;min-height:100vh;padding-bottom:30px}
header{background:linear-gradient(90deg,#0f2027,#2c5364);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px}
header .info{font-size:11px;color:#ffd200;margin-top:3px}
header a{color:#fff;text-decoration:none;font-size:12px;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px}
.tabs{display:flex;gap:4px;padding:10px;overflow-x:auto;background:#0f2027}
.tab{padding:8px 14px;background:rgba(255,255,255,0.06);border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;white-space:nowrap;color:#a0b8c4}
.tab.active{background:linear-gradient(90deg,#f7971e,#ffd200);color:#0f2027}
.container{padding:14px;max-width:820px;margin:0 auto}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin-bottom:12px}
.label{color:#7a9bab;font-size:11px}
.phone{font-size:15px;font-weight:bold;color:#ffd200;direction:ltr}
.name{color:#fff;font-size:14px;margin-top:3px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;white-space:nowrap}
.pending{background:#5d4a00;color:#ffd200}
.approved{background:#1b5e20;color:#a5d6a7}
.rejected{background:#b71c1c;color:#ef9a9a}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:Tahoma}
.btn-ok{background:#25D366;color:#fff}
.btn-no{background:#e53935;color:#fff}
.btn-blue{background:#2c5364;color:#fff}
.btn-gold{background:linear-gradient(90deg,#f7971e,#ffd200);color:#0f2027}
.btn-sm{padding:6px 10px;font-size:11px}
.img-box img{max-width:100%;max-height:300px;border-radius:10px;margin-top:10px;cursor:pointer}
.img-box a{color:#ffd200;text-decoration:none;font-size:13px;font-weight:bold;display:inline-block;margin-top:8px}
.empty{text-align:center;color:#5a7a8a;padding:40px;font-size:13px}
.hidden{display:none}
input,textarea,select{width:100%;padding:11px;border:2px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;border-radius:8px;margin-bottom:8px;font-size:14px;font-family:Tahoma}
textarea{min-height:70px;resize:vertical}
.add-form{background:rgba(255,255,255,0.03);border:2px dashed rgba(255,210,0,0.3);border-radius:12px;padding:16px;margin-bottom:16px}
.add-form h3{margin-bottom:12px;color:#ffd200;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:start;gap:8px;flex-wrap:wrap}
.code-box{background:rgba(255,210,0,0.15);border:2px solid #ffd200;padding:8px 12px;border-radius:8px;font-family:'Courier New',monospace;font-size:16px;color:#ffd200;font-weight:bold;letter-spacing:2px;direction:ltr;display:inline-block;margin-top:6px}
.stat-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;text-align:center}
.stat .num{font-size:26px;font-weight:bold;color:#ffd200;margin-bottom:4px}
.stat .lbl{font-size:11px;color:#7a9bab}
.q-edit{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;margin-bottom:10px}
.q-edit input{margin-bottom:6px}
.q-edit .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.q-edit .opts input{margin-bottom:0}
</style>
</head>
<body>

<header>
<div>
<h1>📚 لوحة الأستاذ {{ teacher }}</h1>
<div class="info">إدارة {{ subject }}</div>
</div>
<a href="/admin/logout">خروج</a>
</header>

<div class="tabs">
<div class="tab active" onclick="tab('enroll',this)">📥 الطلبات</div>
<div class="tab" onclick="tab('students',this)">👥 الطلاب</div>
<div class="tab" onclick="tab('videos',this)">🎬 الفيديوهات</div>
<div class="tab" onclick="tab('homework',this)">📝 الواجبات</div>
<div class="tab" onclick="tab('exams',this)">📊 الامتحانات</div>
<div class="tab" onclick="tab('results',this)">🏆 النتائج</div>
</div>

<div class="container">
<div id="enrollView"></div>
<div id="studentsView" class="hidden"></div>
<div id="videosView" class="hidden"></div>
<div id="homeworkView" class="hidden"></div>
<div id="examsView" class="hidden"></div>
<div id="resultsView" class="hidden"></div>
</div>

<script>
async function loadEnroll() {
    var r = await fetch('/api/admin/enrollments');
    var d = await r.json();
    var b = document.getElementById('enrollView');
    if (!d.length) { b.innerHTML = '<div class="empty">مفيش طلبات</div>'; return; }
    b.innerHTML = d.map(function(x) {
        var img = x.screenshot ? '<div class="img-box"><a href="/uploads/' + x.screenshot + '" target="_blank">📷 عرض صورة الدفع</a><br><img src="/uploads/' + x.screenshot + '" onclick="window.open(this.src)"></div>' : '';
        var gradeTxt = x.grade === 'first' ? 'أول ثانوي' : 'تانية ثانوي';
        var stTxt = x.status === 'pending' ? '⏳ معلق' : (x.status === 'approved' ? '✅ تم' : '❌ مرفوض');
        var actions = '';
        if (x.status === 'pending') {
            actions = '<div style="margin-top:10px;background:rgba(255,210,0,0.1);padding:12px;border-radius:8px">' +
                '<div class="label" style="margin-bottom:6px">🔑 كود التفعيل (اكتبه وابعته للطالب):</div>' +
                '<input id="code_' + x.id + '" placeholder="مثلاً: AHMED2026" style="font-family:monospace">' +
                '<button class="btn btn-ok" onclick="approve(' + x.id + ')" style="width:100%;margin-top:6px">✅ موافقة وتفعيل</button>' +
                '<button class="btn btn-no" onclick="reject(' + x.id + ')" style="width:100%;margin-top:6px">❌ رفض</button>' +
                '</div>';
        }
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="phone">' + x.phone + '</div>' +
            '<div class="name">' + x.student_name + '</div>' +
            '<div style="margin-top:6px"><span class="label">الصف:</span> <b>' + gradeTxt + '</b></div>' +
            '<div class="label">' + x.created_at + '</div>' +
            '</div><span class="badge ' + x.status + '">' + stTxt + '</span></div>' +
            img + actions + '</div>';
    }).join('');
}

async function approve(id) {
    var code = document.getElementById('code_' + id).value.trim();
    if (!code) return alert('اكتب كود التفعيل');
    if (!confirm('موافقة وتفعيل الطالب بالكود: ' + code + '؟')) return;
    var r = await fetch('/api/admin/enrollment/' + id + '/approve', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code: code})
    });
    var d = await r.json();
    if (!d.ok) return alert(d.msg);
    alert('✅ تم تفعيل الطالب بكود: ' + code);
    loadEnroll();
}

async function reject(id) {
    if (!confirm('رفض الطلب؟')) return;
    await fetch('/api/admin/enrollment/' + id + '/reject', {method: 'POST'});
    loadEnroll();
}

async function loadStudents() {
    var r = await fetch('/api/admin/students');
    var d = await r.json();
    var b = document.getElementById('studentsView');
    if (!d.length) { b.innerHTML = '<div class="empty">مفيش طلاب</div>'; return; }
    b.innerHTML = d.map(function(s) {
        var grade = s.grade === 'first' ? 'أول ثانوي' : 'تانية ثانوي';
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="phone">' + s.phone + '</div>' +
            '<div class="name">' + s.name + '</div>' +
            '<div><span class="label">الصف:</span> <b>' + grade + '</b></div>' +
            (s.code ? '<div class="code-box">' + s.code + '</div>' : '') +
            '</div>' +
            (s.activated ? '<span class="badge approved">✅ مفعّل</span>' : '<span class="badge pending">⏳ غير مفعّل</span>') +
            '</div>' +
            '<div class="actions"><button class="btn btn-no btn-sm" onclick="delStudent(' + s.id + ')">🗑️ حذف</button></div>' +
            '</div>';
    }).join('');
}

async function delStudent(id) {
    if (!confirm('حذف الطالب؟')) return;
    await fetch('/api/admin/student/' + id, {method: 'DELETE'});
    loadStudents();
}

async function loadVideos() {
    var r = await fetch('/api/admin/videos');
    var d = await r.json();
    var b = document.getElementById('videosView');
    var form = '<div class="add-form"><h3>➕ إضافة فيديو</h3>' +
        '<input id="v_title" placeholder="عنوان الفيديو">' +
        '<input id="v_url" placeholder="لينك YouTube" style="direction:ltr">' +
        '<input id="v_lesson" placeholder="الدرس (اختياري)">' +
        '<select id="v_grade"><option value="first">أول ثانوي</option><option value="second">تانية ثانوي</option></select>' +
        '<button class="btn btn-gold" onclick="addVideo()" style="width:100%">إضافة</button></div>';
    var list = d.length ? d.map(function(v) {
        var g = v.grade === 'first' ? 'أول' : 'تانية';
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="name">🎬 ' + v.title + '</div>' +
            '<div class="label">' + g + ' — ' + (v.lesson || '') + '</div>' +
            '<div style="direction:ltr;font-size:11px;color:#7a9bab;margin-top:4px">' + v.url.substring(0, 50) + '</div>' +
            '</div><button class="btn btn-no btn-sm" onclick="delVideo(' + v.id + ')">🗑️</button></div></div>';
    }).join('') : '<div class="empty">مفيش فيديوهات</div>';
    b.innerHTML = form + list;
}

async function addVideo() {
    var d = {
        title: document.getElementById('v_title').value.trim(),
        url: document.getElementById('v_url').value.trim(),
        lesson: document.getElementById('v_lesson').value.trim(),
        grade: document.getElementById('v_grade').value
    };
    if (!d.title || !d.url) return alert('اكمل البيانات');
    await fetch('/api/admin/videos', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d)});
    loadVideos();
}

async function delVideo(id) {
    if (!confirm('حذف؟')) return;
    await fetch('/api/admin/video/' + id, {method: 'DELETE'});
    loadVideos();
}

async function loadHomework() {
    var r = await fetch('/api/admin/homework');
    var d = await r.json();
    var b = document.getElementById('homeworkView');
    var form = '<div class="add-form"><h3>➕ إضافة واجب</h3>' +
        '<input id="h_title" placeholder="عنوان الواجب">' +
        '<textarea id="h_desc" placeholder="تفاصيل الواجب"></textarea>' +
        '<input id="h_due" placeholder="آخر ميعاد (مثلاً: 2026-10-15)">' +
        '<select id="h_grade"><option value="first">أول ثانوي</option><option value="second">تانية ثانوي</option></select>' +
        '<button class="btn btn-gold" onclick="addHW()" style="width:100%">إضافة</button></div>';
    var list = d.length ? d.map(function(h) {
        var g = h.grade === 'first' ? 'أول' : 'تانية';
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="name">📝 ' + h.title + '</div>' +
            '<div class="label">' + g + (h.due_date ? ' — ' + h.due_date : '') + '</div>' +
            '<div style="font-size:13px;color:#a0b8c4;margin-top:6px">' + h.description + '</div>' +
            '</div><button class="btn btn-no btn-sm" onclick="delHW(' + h.id + ')">🗑️</button></div></div>';
    }).join('') : '<div class="empty">مفيش واجبات</div>';
    b.innerHTML = form + list;
}

async function addHW() {
    var d = {
        title: document.getElementById('h_title').value.trim(),
        description: document.getElementById('h_desc').value.trim(),
        due_date: document.getElementById('h_due').value.trim(),
        grade: document.getElementById('h_grade').value
    };
    if (!d.title) return alert('اكتب عنوان الواجب');
    await fetch('/api/admin/homework', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d)});
    loadHomework();
}

async function delHW(id) {
    if (!confirm('حذف؟')) return;
    await fetch('/api/admin/homework/' + id, {method: 'DELETE'});
    loadHomework();
}

async function loadExams() {
    var r = await fetch('/api/admin/exams');
    var d = await r.json();
    var b = document.getElementById('examsView');
    var form = '<div class="add-form"><h3>➕ إضافة امتحان</h3>' +
        '<input id="e_title" placeholder="عنوان الامتحان">' +
        '<input type="number" id="e_duration" placeholder="المدة بالدقايق" value="30">' +
        '<select id="e_grade"><option value="first">أول ثانوي</option><option value="second">تانية ثانوي</option></select>' +
        '<div id="questionsBox"></div>' +
        '<button class="btn btn-blue" onclick="addQ()" style="width:100%;margin-top:8px">➕ إضافة سؤال</button>' +
        '<button class="btn btn-gold" onclick="saveExam()" style="width:100%;margin-top:8px">💾 حفظ الامتحان</button></div>';
    var list = d.length ? d.map(function(e) {
        var g = e.grade === 'first' ? 'أول' : 'تانية';
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="name">📊 ' + e.title + '</div>' +
            '<div class="label">' + g + ' — ' + e.duration + ' دقيقة — ' + e.total_marks + ' سؤال</div>' +
            '</div><span class="badge ' + (e.active ? 'approved' : 'pending') + '">' + (e.active ? '✅ نشط' : '⏳ متوقف') + '</span></div>' +
            '<div class="actions">' +
            '<button class="btn btn-blue btn-sm" onclick="toggleExam(' + e.id + ')">' + (e.active ? '⏸️ إيقاف' : '▶️ تنشيط') + '</button>' +
            '<button class="btn btn-no btn-sm" onclick="delExam(' + e.id + ')">🗑️ حذف</button>' +
            '</div></div>';
    }).join('') : '<div class="empty">مفيش امتحانات</div>';
    b.innerHTML = form + list;
    questions = [];
    addQ();
}

var questions = [];

function addQ() {
    var idx = questions.length;
    questions.push({q: '', a: '', b: '', c: '', d: '', correct: 0});
    var box = document.getElementById('questionsBox');
    var html = '<div class="q-edit" id="q_' + idx + '">' +
        '<input placeholder="السؤال ' + (idx+1) + '" oninput="questions[' + idx + '].q=this.value">' +
        '<div class="opts">' +
        '<input placeholder="اختيار 1" oninput="questions[' + idx + '].a=this.value">' +
        '<input placeholder="اختيار 2" oninput="questions[' + idx + '].b=this.value">' +
        '<input placeholder="اختيار 3" oninput="questions[' + idx + '].c=this.value">' +
        '<input placeholder="اختيار 4" oninput="questions[' + idx + '].d=this.value">' +
        '</div>' +
        '<select onchange="questions[' + idx + '].correct=parseInt(this.value)" style="margin-top:6px">' +
        '<option value="0">الإجابة الصح: 1</option>' +
        '<option value="1">الإجابة الصح: 2</option>' +
        '<option value="2">الإجابة الصح: 3</option>' +
        '<option value="3">الإجابة الصح: 4</option>' +
        '</select></div>';
    box.insertAdjacentHTML('beforeend', html);
}

async function saveExam() {
    var title = document.getElementById('e_title').value.trim();
    var duration = document.getElementById('e_duration').value;
    var grade = document.getElementById('e_grade').value;
    if (!title) return alert('اكتب عنوان الامتحان');
    var valid = questions.filter(function(q){ return q.q && q.a && q.b && q.c && q.d; });
    if (!valid.length) return alert('اكتب سؤال واحد على الأقل');
    var d = {title: title, duration: duration, grade: grade, questions: valid, active: true};
    await fetch('/api/admin/exams', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d)});
    alert('✅ تم حفظ الامتحان');
    loadExams();
}

async function toggleExam(id) {
    await fetch('/api/admin/exam/' + id + '/toggle', {method: 'POST'});
    loadExams();
}

async function delExam(id) {
    if (!confirm('حذف؟')) return;
    await fetch('/api/admin/exam/' + id, {method: 'DELETE'});
    loadExams();
}

async function loadResults() {
    var r = await fetch('/api/admin/results');
    var d = await r.json();
    var b = document.getElementById('resultsView');
    if (!d.length) { b.innerHTML = '<div class="empty">مفيش نتائج</div>'; return; }
    b.innerHTML = d.map(function(x) {
        var pct = Math.round((x.score / x.total) * 100);
        return '<div class="card"><div class="row"><div style="flex:1">' +
            '<div class="name">' + x.student_name + '</div>' +
            '<div class="phone">' + x.student_phone + '</div>' +
            '<div class="label">امتحان #' + x.exam_id + ' — ' + x.created_at + '</div>' +
            '</div><span class="badge approved" style="font-size:14px;padding:8px 14px">' + x.score + ' / ' + x.total + ' (' + pct + '%)</span></div></div>';
    }).join('');
}

function tab(t, el) {
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    ['enroll','students','videos','homework','exams','results'].forEach(function(v){
        document.getElementById(v+'View').classList.add('hidden');
    });
    document.getElementById(t+'View').classList.remove('hidden');
    if (t === 'enroll') loadEnroll();
    if (t === 'students') loadStudents();
    if (t === 'videos') loadVideos();
    if (t === 'homework') loadHomework();
    if (t === 'exams') loadExams();
    if (t === 'results') loadResults();
}

loadEnroll();
</script>
</body>
</html>
