<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم التسجيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0}
body{background:#020617;min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:440px;width:100%;text-align:center}
.icon{font-size:90px;margin-bottom:20px;display:block}
h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px}
.box{background:rgba(255,152,0,0.1);border:1.5px solid rgba(255,152,0,0.3);border-radius:20px;padding:20px;margin:24px 0;text-align:right;font-size:14px;line-height:2;color:#ffb74d}
.box b{color:#ffd200}
.btn{display:block;width:100%;padding:16px;font-size:16px;font-weight:900;background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;border:none;border-radius:16px;text-decoration:none;text-align:center;margin-top:12px;box-shadow:0 15px 40px rgba(247,151,30,0.35)}
</style>
</head>
<body>
<div class="wrap">
<span class="icon">⏳</span>
<h1>تم استلام طلبك</h1>
<p style="color:#94a3b8;font-size:14px">طلبك في انتظار موافقة الأستاذ</p>

<div class="box">
<b>الخطوة الجاية:</b><br>
1. الأستاذ هيراجع صورة التحويل<br>
2. هيتواصل معاك على واتساب<br>
3. هيبعتلك <b>كود التفعيل</b><br>
4. هتدخل بيه المنصة
</div>

<a href="/" class="btn">🏠 رجوع للرئيسية</a>
</div>
</body>
</html>
