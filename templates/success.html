<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم التسجيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif;margin:0;padding:0}
body{background:#020617;min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,#0f1e3d 0%,#020617 60%);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.3}
.o1{width:400px;height:400px;background:#f7971e;top:-120px;right:-120px}
.o2{width:380px;height:380px;background:#6366f1;bottom:-120px;left:-120px}
.stars{position:absolute;inset:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{0%,100%{opacity:0.2}50%{opacity:1}}
.wrap{position:relative;z-index:2;max-width:440px;width:100%;text-align:center}
.icon{font-size:100px;margin-bottom:20px;display:block;animation:pop 0.6s cubic-bezier(.5,1.8,.5,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fff,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px}
.sub{color:#94a3b8;font-size:14px;margin-bottom:24px}
.box{background:linear-gradient(135deg,rgba(247,151,30,0.12),rgba(255,210,0,0.04));border:1.5px solid rgba(255,210,0,0.3);border-radius:20px;padding:20px;margin:24px 0;text-align:right;font-size:14px;line-height:2;color:#cbd5e1}
.box b{color:#ffd200;display:block;margin-bottom:10px;font-size:15px}
.box .step{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.box .step .n{background:rgba(255,210,0,0.15);color:#ffd200;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.btn{display:block;width:100%;padding:18px;font-size:16px;font-weight:900;background:linear-gradient(135deg,#f7971e,#ffd200);color:#0a0f1e;border:none;border-radius:18px;text-decoration:none;text-align:center;margin-top:12px;box-shadow:0 15px 40px rgba(247,151,30,0.4)}
.btn:active{transform:scale(0.97)}
.btn2{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.12);box-shadow:none;font-size:14px}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="stars" id="stars"></div></div>
<div class="wrap">
<span class="icon">⏳</span>
<h1>تم استلام طلبك</h1>
<div class="sub">طلبك في انتظار موافقة الأستاذ</div>
<div class="box">
<b>الخطوة الجاية:</b>
<div class="step"><div class="n">1</div><div>الأستاذ هيراجع صورة التحويل</div></div>
<div class="step"><div class="n">2</div><div>هيتواصل معاك على واتساب</div></div>
<div class="step"><div class="n">3</div><div>هيبعتلك <b style="color:#ffd200;display:inline">كود التفعيل</b></div></div>
<div class="step"><div class="n">4</div><div>هتدخل بيه المنصة وتشوف الدروس</div></div>
</div>
<a href="/" class="btn">🏠 رجوع للرئيسية</a>
<a href="/login" class="btn btn2">🔐 عندي كود بالفعل</a>
</div>
<script>
var sb=document.getElementById('stars');
for(var i=0;i<30;i++){var s=document.createElement('div');s.className='star';var sz=Math.random()*2+1;s.style.width=sz+'px';s.style.height=sz+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';sb.appendChild(s)}
</script>
</body>
</html>
